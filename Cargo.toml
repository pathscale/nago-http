[package]
name = "nago-http"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A small HTTP/1.1 client over nagoya and nago-rustls. No tokio, no OpenSSL, no C"
repository = "https://github.com/pathscale/nago-http"
readme = "README.md"
keywords = ["http", "https", "client", "no-runtime", "nagoya"]
categories = ["network-programming", "web-programming::http-client"]

[dependencies]
nagoya = { version = "^0.1", features = ["reactor"] }
nago-rustls = "^0.1"
