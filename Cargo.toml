[package]
name = "nago-http"
version = "0.2.3"
publish = ["crates-io"]

edition = "2024"
license = "MIT OR Apache-2.0"
description = "A small HTTP/1.1 client over nagoya and nago-rustls. No tokio, no OpenSSL, no C"
repository = "https://github.com/pathscale/nago-http"
readme = "README.md"
keywords = ["http", "https", "client", "no-runtime", "nagoya"]
categories = ["network-programming", "web-programming::http-client", "no-std"]

[features]
default = []

[dependencies]
ekostd = { version = "^0.2.11", default-features = false }
nagoya = { version = "^0.1.24", default-features = false, features = ["reactor"] }
nago-rustls = { version = "^0.2.3", default-features = false, features = ["webpki-roots"] }
ps-rustcrypto = { version = "^0.6.2", default-features = false, features = ["alloc", "tls12", "zeroize", "rsa-pss"] }
webpki-roots = "^1"

[dev-dependencies]
rcgen = "0.14"
rustls = { version = "^0.23", default-features = false, features = ["std", "tls12"] }
