[package]
name = "nago-http"
version = "0.2.1"
publish = ["crates-io"]

edition = "2024"
license = "MIT OR Apache-2.0"
description = "A small HTTP/1.1 client over nagoya and nago-rustls. No tokio, no OpenSSL, no C"
repository = "https://github.com/pathscale/nago-http"
readme = "README.md"
keywords = ["http", "https", "client", "no-runtime", "nagoya"]
categories = ["network-programming", "web-programming::http-client"]

[features]
default = ["std"]
std = ["nagoya/reactor", "nago-rustls/std", "ps-rustcrypto/std"]
eko = ["dep:ekostd", "ekostd/libc-rs", "nagoya/eko", "nago-rustls/eko", "ps-rustcrypto/eko"]

[dependencies]
ekostd = { version = "^0.2.9", optional = true }
nagoya = { version = "^0.1.21", default-features = false }
nago-rustls = { version = "^0.2.1", default-features = false, features = ["webpki-roots"] }
ps-rustcrypto = { version = "^0.6.1", default-features = false, features = ["alloc", "tls12", "zeroize", "rsa-pss"] }
webpki-roots = "^1"

[dev-dependencies]
rcgen = "0.14"
