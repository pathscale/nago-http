name: CI

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
